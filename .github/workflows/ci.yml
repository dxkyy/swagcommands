name: CI

on:
  push:
    branches: [v2, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build JavaScript and declarations
        run: pnpm run build
      - name: Runtime tests
        run: pnpm exec vitest run
      - name: Typecheck source and tests
        run: pnpm run test:typecheck
      - name: Verify packaged declarations and exports
        run: pnpm run test:package
